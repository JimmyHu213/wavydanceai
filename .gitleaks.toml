[extend]
# Extend the default ruleset so we only need to declare exceptions.
useDefault = true

[[allowlists]]
description = "Test fixture access tokens are not real credentials"
# stopwords cause a finding to be skipped if the matched secret contains any of these substrings.
stopwords = ["bob-tok-", "bob-admin-tok-", "bob-access-token", "bob-admin-access"]
